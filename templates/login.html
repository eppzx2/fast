<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>FAST Sign In</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
:root{--bg:#10151C;--panel:#19212B;--border:rgba(140,160,184,.18);--text:#D5DDE6;--muted:#9AA7B5;--blue:#7FAFD2;--blue2:#6D98BA;--red:#D9868C}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,rgba(101,150,185,.13),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(420px,calc(100% - 32px));border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,rgba(12,21,19,.98),rgba(6,12,11,.98));padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.38)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}h1{font-size:24px;margin:0 0 7px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:22px}.field{margin-top:13px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}.field input{width:100%;border:1px solid var(--border);border-radius:10px;background:#121923;color:var(--text);padding:11px 12px;outline:none}.field input:focus{border-color:rgba(127,175,210,.6);box-shadow:0 0 0 3px rgba(127,175,210,.08)}button{width:100%;margin-top:18px;border:1px solid rgba(166,200,226,.35);border-radius:10px;padding:11px 14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#10151C;font-weight:800;cursor:pointer}.error{margin:0 0 14px;padding:10px 12px;border:1px solid rgba(217,134,140,.28);border-radius:10px;background:rgba(217,134,140,.07);color:#D99AA2;font-size:12px}.note{margin-top:18px;color:var(--muted);font-size:10.5px;line-height:1.55}
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img class="mark" src="/static/favicon.svg" alt="FAST" width="44" height="44"><div><strong>FAST</strong><div style="font-size:10px;color:var(--muted);margin-top:2px">Security Operations Platform</div></div></div>
    <h1>Sign in</h1>
    <div class="sub">Authenticate before accessing FAST security telemetry and analyst workflows.</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_path }}">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Sign in to FAST</button>
    </form>
    <div class="note">Roles supported: Viewer, Analyst and Admin. Wazuh credentials are never sent to the browser.</div>
  </main>
</body>
</html>
